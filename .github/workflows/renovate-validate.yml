name: renovate-validate

on:
  pull_request:
    branches:
      - master
    paths:
      - renovate.json
      - .github/workflows/renovate-validate.yml
  push:
    branches:
      - master
    paths:
      - renovate.json
      - .github/workflows/renovate-validate.yml

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate
        uses: rinchsan/renovate-config-validator@v0.2.1
        with:
          pattern: 'renovate.json'
