# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2.1
jobs:
  build:
    docker: &docker
      # specify the version you desire here
      - image: cimg/node:lts

    steps:
      - checkout

      # Download and cache dependencies (Yarn 4 keeps them in its global cache)
      - restore_cache:
          keys:
            - v7-dependencies-{{ checksum "yarn.lock" }}
            # fallback to using the latest cache if no exact match is found
            - v7-dependencies-

      # The image's yarn hands off to .yarn/releases via yarnPath. build:pkg
      # builds every package, so install skips their install scripts.
      - run:
          name: yarn install
          command: |
            yarn install --immutable --mode=skip-build
            yarn build:pkg

      - save_cache:
          paths:
            - ~/.yarn/berry/cache
          key: v7-dependencies-{{ checksum "yarn.lock" }}

      - persist_to_workspace:
          root: ~/
          paths:
            - project

  salus:
    machine: true
    steps:
      - checkout
      - run: docker run -t -v $(pwd):/home/repo coinbase/salus

  # webpack-config's suite takes as long as all the others, so it gets its own job
  test:
    docker: *docker
    steps:
      - attach_workspace:
          at: ~/
      - run: yarn workspaces foreach -Wv --exclude @anansi/webpack-config run test:ci --passWithNoTests

  test_webpack_config:
    docker: *docker
    steps:
      - attach_workspace:
          at: ~/
      - run: yarn workspace @anansi/webpack-config run test:ci

  lint:
    docker: *docker
    steps:
      - attach_workspace:
          at: ~/
      - run: yarn run lint
      - run: yarn test:type
      - run: yarn build:agent-rules --check

  # Each parallel node builds its share of the example-* workspaces
  build_production:
    docker: *docker
    parallelism: 3
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Build examples
          command: |
            examples=$(yarn workspaces list --json | grep -o '"name":"example-[^"]*"' | cut -d'"' -f4 | circleci tests split)
            for workspace in $examples; do
              yarn workspace "$workspace" run build
            done

  build_matrix:
    parameters:
      browserslist-env:
        type: string
    docker: *docker
    steps:
      - attach_workspace:
          at: ~/
      - run: BROWSERSLIST_ENV='<< parameters.browserslist-env >>' yarn workspace example-typescript run build

  start_dev:
    docker: *docker
    steps:
      - attach_workspace:
          at: ~/
      - run: yarn devtest:ci

  build_server:
    docker: *docker
    steps:
      - attach_workspace:
          at: ~/
      - run: yarn workspaces foreach -Wv --include 'example-*' run build:server

  build_storybook:
    docker: *docker
    steps:
      - attach_workspace:
          at: ~/
      - run: yarn workspace example-typescript build:storybook


workflows:
  version: 2
  build:
    jobs:
      - build
      - salus
      - lint:
          requires:
            - build
      - test:
          requires:
            - build
      - test_webpack_config:
          requires:
            - build
      - build_production:
          requires:
            - build
      - build_matrix:
          matrix:
            parameters:
              browserslist-env: ["2018", "2020", "2022"]
          requires:
            - build
      - start_dev:
          requires:
            - build
      - build_server:
          requires:
            - build
      - build_storybook:
          requires:
            - build
