changesetIgnorePatterns:
  - "**/__tests__/**"
  - "**/*.md"

nodeLinker: node-modules

# Yarn quarantines versions younger than npmMinimalAgeGate (default 1d);
# renovate.json minimumReleaseAge matches it. First-party packages skip it
# here and in renovate.json.
npmPreapprovedPackages:
  - "@anansi/*"
  - "@data-client/*"
  - "@pojo-router/*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
